spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/PARIS_DEVS
spring.datasource.username=springuser
spring.datasource.password=spring

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.packages-to-scan=com.parisdevs.api.controller

# JWT de desenvolvimento (HS256 exige >= 32 bytes). Não usar este valor em produção.
app.jwt.secret=paris-devs-dev-jwt-secret-nao-usar-em-producao-32b
app.jwt.expiration-ms=28800000

# Chaves ficam no ambiente. O painel também pode enviá-las para a memória deste processo.
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=gpt-4o-mini
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=claude-sonnet-4-5
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-2.5-flash

# Sandbox por padrão. Produção só com a flag explícita. Segredos ficam no ambiente ou na memória do processo.
app.itau.client-id=${ITAU_CLIENT_ID:}
app.itau.client-secret=${ITAU_CLIENT_SECRET:}
app.itau.producao-habilitada=false
app.itau.sandbox-base-url=https://sandbox.devportal.itau.com.br/itau-vw9-api-account-statement-v1-externo/v1
app.itau.producao-base-url=https://account-statement.api.dev.itau.com/account-statement/v1
app.itau.sandbox-token-url=https://sts.rdhi.com.br/api/oauth/token
app.itau.producao-token-url=https://sts.itau.com.br/api/oauth/token

app.pluggy.client-id=${PLUGGY_CLIENT_ID:}
app.pluggy.client-secret=${PLUGGY_CLIENT_SECRET:}
app.pluggy.producao-habilitada=false
app.pluggy.sandbox-connector-id=0

app.xp.client-id=${XP_CLIENT_ID:}
app.xp.client-secret=${XP_CLIENT_SECRET:}
app.xp.subscription-key=${XP_SUBSCRIPTION_KEY:}
app.xp.certificado-caminho=${XP_CERTIFICADO_CAMINHO:}
